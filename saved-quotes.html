<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Saved Quotes | Jewellery Quotation Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>

:root{
 --bg:#0b1020;--card:#121a2f;--card-soft:#18213b;--ink:#f4f7ff;--muted:#a7b2d2;
 --line:rgba(168,184,230,0.2);--gold:#f0b43f;--gold-strong:#ffcc66;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',sans-serif;color:var(--ink);background:radial-gradient(1000px 500px at -10% -20%, #253056 0%, rgba(37,48,86,0) 65%),radial-gradient(900px 420px at 110% 0%, #3e2a52 0%, rgba(62,42,82,0) 70%),linear-gradient(180deg,#0b1020,#090d1b 65%);padding:24px;min-height:100vh}
.app{max-width:1420px;margin:auto;display:grid;grid-template-columns:250px 1fr;gap:20px;align-items:start}
.sidebar{position:sticky;top:20px}
.sidebar-card{background:linear-gradient(180deg,var(--card),var(--card-soft));border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 24px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:12px}
.sidebar-card h2{margin:0;color:var(--gold-strong);font-size:17px;font-family:'Playfair Display',serif}
.sidebar-item{display:flex;align-items:center;gap:10px;width:100%;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--ink);padding:12px 14px;font-weight:600;text-align:left;text-decoration:none;transition:.2s}
.sidebar-item:hover,.sidebar-item.active{transform:translateY(-1px);border-color:rgba(255,204,102,.45);box-shadow:0 10px 22px rgba(240,180,63,.18);background:rgba(255,204,102,.08)}
.container{max-width:1200px;margin:auto;background:linear-gradient(180deg,rgba(18,25,46,.95),rgba(12,18,35,.95));border-radius:24px;padding:28px;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.35)}
.header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:6px 4px 22px;border-bottom:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.title-wrap h1{font-family:'Playfair Display',serif;font-size:32px;margin:0;color:var(--gold-strong)}
.title-wrap p{margin:8px 0 0;color:var(--muted);font-size:14px}
button{padding:10px 20px;border:none;border-radius:999px;background:linear-gradient(135deg,#f0b43f,#dd8f17);color:#1a1f34;font-weight:700;cursor:pointer;transition:.2s}
button.secondary{background:rgba(255,255,255,.03);color:var(--ink);border:1px solid var(--line)}
button:hover{transform:translateY(-1px);box-shadow:0 10px 18px rgba(0,0,0,.25)}
.section{margin-top:20px;padding:18px;border-radius:18px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
h3{margin:0 0 12px;font-size:18px;color:var(--gold-strong)}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);margin-top:6px;font-family:'Manrope',sans-serif;background:#0e1731;color:var(--ink)}
input::placeholder{color:#8e9ac0}
input:focus{outline:2px solid rgba(255,204,102,.25);border-color:rgba(255,204,102,.5)}
.note{color:var(--muted);font-size:13px;margin-top:8px}
.saved-list{display:grid;gap:12px}
.saved-card{background:#0f1935;border:1px solid rgba(168,184,230,.2);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
.saved-card small,.saved-meta{color:var(--muted);font-size:12px}.saved-title{font-weight:700;color:var(--ink)}
.saved-actions,.saved-actions-inline{display:flex;gap:8px;flex-wrap:wrap}.saved-actions-inline button{padding:6px 12px;font-size:12px}
@media (max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:static}.container{max-width:100%}}

</style>
</head>
<body>
<div class="app">
 <aside class="sidebar">
  <div class="sidebar-card">
   <h2>Quote Tools</h2>
   <a class="sidebar-item" href="index.html?new=1">➕ New Quote</a>
   <a class="sidebar-item active" href="saved-quotes.html">📄 Saved Quotes</a>
   <a class="sidebar-item" href="search-quotes.html">🔍 Search Quote</a>
  </div>
 </aside>
 <main class="container">
  <div class="header">
   <div class="title-wrap">
    <h1>Saved Quotes</h1>
    <p>Review previously saved quotations and manage the list.</p>
   </div>
   <div class="actions">
    <button class="secondary" onclick="location.href='index.html'">Open Calculator</button>
   </div>
  </div>

  <div class="section">
   <h3>Saved Quote Library</h3>
   <div class="saved-actions">
    <button class="secondary" onclick="clearSavedQuotes()">Clear Saved Quotes</button>
   </div>
   <div id="savedQuotesList" class="saved-list"></div>
   <p class="note" id="savedQuotesEmpty">No saved quotes yet. Save one from the calculator to keep it here.</p>
  </div>
 </main>
</div>

<script>
function getSavedQuotes(){
 try{
  return JSON.parse(localStorage.getItem('savedQuotes') || '[]');
 }catch(err){
  return [];
 }
}

function setSavedQuotes(quotes){
 localStorage.setItem('savedQuotes', JSON.stringify(quotes));
}

function removeSavedQuote(id){
 const quotes = getSavedQuotes().filter(item => item.id !== id);
 setSavedQuotes(quotes);
 renderSavedQuotes();
}

function clearSavedQuotes(){
 setSavedQuotes([]);
 renderSavedQuotes();
}

function renderSavedQuotes(){
 const quotes = getSavedQuotes();
 const savedList = document.getElementById('savedQuotesList');
 const emptyNote = document.getElementById('savedQuotesEmpty');

 const createCard = (item) => {
  const wrapper = document.createElement('div');
  wrapper.className = 'saved-card';
  const title = document.createElement('div');
  title.innerHTML = `<div class="saved-title">${item.customerName || 'Unnamed Client'}</div>
   <div class="saved-meta">${item.quoteRef ? `Ref: ${item.quoteRef}` : 'No reference'}</div>`;
  const total = document.createElement('div');
  const totalValue = new Intl.NumberFormat('en-IN', {style:'currency',currency:'INR',maximumFractionDigits:2}).format(item.totalInr || 0);
  total.innerHTML = `<div class="saved-title">${totalValue}</div>
   <small>${new Date(item.createdAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' })}</small>`;
  const actions = document.createElement('div');
  actions.className = 'saved-actions-inline';
  const editBtn = document.createElement('button');
  editBtn.className = 'secondary';
  editBtn.textContent = 'Edit';
  editBtn.onclick = () => {
   window.location.href = `index.html?quoteId=${item.id}`;
  };
  const removeBtn = document.createElement('button');
  removeBtn.className = 'secondary';
  removeBtn.textContent = 'Remove';
  removeBtn.onclick = () => removeSavedQuote(item.id);
  actions.appendChild(editBtn);
  actions.appendChild(removeBtn);
  wrapper.appendChild(title);
  wrapper.appendChild(total);
  wrapper.appendChild(actions);
  return wrapper;
 };

 if(savedList){
  savedList.innerHTML = '';
  quotes.forEach(item => savedList.appendChild(createCard(item)));
 }
 if(emptyNote){
  emptyNote.style.display = quotes.length ? 'none' : 'block';
 }
}

renderSavedQuotes();
</script>
</body>
</html>
